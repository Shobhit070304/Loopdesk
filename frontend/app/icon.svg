      <stop offset="0%" stop-color="#181b2e" />
      <stop offset="100%" stop-color="#0b0d17" />
    </linearGradient>
    <linearGradient id="ld-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
